# ==================== APP ====================
spring.application.name=film_be
server.port=8080
app.api.prefix=film

# ==================== DATABASE ====================
spring.datasource.url=jdbc:mysql://localhost:3309/film_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=web_film
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==================== JWT ====================
# Access token TTL: 15 phut
app.jwt.access-token-expiration-ms=900000
# Refresh token TTL: 7 ngay
app.jwt.refresh-token-expiration-ms=604800000
# Toggle bat/tat refresh token
app.jwt.refresh-enabled=true

# ==================== REDIS ====================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# ==================== RABBITMQ ====================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
spring.rabbitmq.connection-timeout=5000
spring.rabbitmq.listener.simple.prefetch=1

# ==================== OPENAPI / REDOCLY ====================
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false

# ==================== SCHEDULER ====================
app.scheduler.token-cleanup.enabled=true
app.scheduler.token-cleanup.days-past-expiry=5
app.scheduler.token-cleanup.cron=0 0 0 * * ?

# ==================== LOGGING ====================
app.logging.access-log-file=D:/TruongTD/projects/logs/Flash_DTF_Log/access.log

