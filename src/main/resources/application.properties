# ==================== APP ====================
spring.application.name=film_be
server.port=8080
app.api.prefix=film

# ==================== DATABASE ====================
spring.datasource.url=jdbc:mysql://localhost:3311/flastdtf?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=flastdtf
spring.datasource.password=flastdtf
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==================== KEYCLOAK / OAUTH2 ====================
# JWKS URI để Spring Security tự fetch public key và verify JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8888/realms/film-realm

# ==================== REDIS ====================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# ==================== RABBITMQ ====================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
spring.rabbitmq.connection-timeout=5000
spring.rabbitmq.listener.simple.prefetch=1

# ==================== OPENAPI / REDOCLY ====================
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false

# ==================== SCHEDULER ====================
app.scheduler.token-cleanup.enabled=true
app.scheduler.token-cleanup.days-past-expiry=5
app.scheduler.token-cleanup.cron=0 0 0 * * ?

# ==================== LOGGING ====================
app.logging.access-log-file=D:/TruongTD/projects/logs/Flash_DTF_Log/access.log
app.logging.redis-log-file=D:/TruongTD/projects/logs/Flash_DTF_Log/redis.log
app.logging.rabbitmq-log-file=D:/TruongTD/projects/logs/Flash_DTF_Log/rabbitmq.log

# ==================== STORAGE & MEDIA ====================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
# Enable AWS S3 storage (true = S3, false = Local Drive)
app.storage.use-s3=false
# Allowed upload mime types
app.storage.allowed-mime-types=image/png,image/tiff,application/pdf,image/jpeg,image/webp
# Max file size in bytes (104857600 = 100MB)
app.storage.max-file-size=104857600
# Local storage configuration
app.storage.local.upload-dir=D:/TruongTD/uploads
app.storage.local.base-url=http://localhost:8080/files/
# AWS S3 configuration
app.storage.s3.region=us-east-1
app.storage.s3.bucket=flash-dtf-bucket
app.storage.s3.access-key=YOUR_AWS_ACCESS_KEY
app.storage.s3.secret-key=YOUR_AWS_SECRET_KEY
app.storage.s3.base-url=https://flash-dtf-bucket.s3.us-east-1.amazonaws.com/


